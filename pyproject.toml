[tool.flake8]
max-line-length = 99

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	"Q000",		# using single quotes
	"I001",		# unsorted imports
	"D",		# missing docstrings

	"CPY001",       # missing copyright

	"T",		# print pprint usage
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.pylint.main]
jobs = 0

[tool.pylint.format]
max-line-length = 99

[tool.pylint."message control"]
enable = [
	"useless-suppression",
	"use-symbolic-message-instead",
]
disable = [
	"missing-docstring",
	"duplicate-code",
]

[tool.pyright]
analyzeUnannotatedFunctions = true

[tool.mypy]
strict = true
check_untyped_defs = true
untyped_calls_exclude = [
	"mediawiki.mediawiki.MediaWiki.page",
]
